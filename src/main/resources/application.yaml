server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: shop
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/customs-schema.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope:
              - openid
              - email
          kakao:
            provider: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}
            scope:
              - account_email
            client-name: Kakao
          line:
            provider: line
            client-id: ${LINE_CHANNEL_ID}
            client-secret: ${LINE_CHANNEL_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${LINE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/line}
            scope:
              - openid
              - email
            client-name: LINE
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          line:
            issuer-uri: https://access.line.me
            authorization-uri: https://access.line.me/oauth2/v2.1/authorize
            token-uri: https://api.line.me/oauth2/v2.1/token
            user-info-uri: https://api.line.me/oauth2/v2.1/userinfo
            user-name-attribute: sub

shop:
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    issuer: zik00-shop
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P14D}
    refresh-cookie-ttl: ${JWT_REFRESH_COOKIE_TTL:PT30M}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  pii:
    current-key-version: ${PII_CURRENT_KEY_VERSION:v1}
    encryption-keys: ${PII_ENCRYPTION_KEYS}
    migrate-plaintext-on-startup: ${PII_MIGRATE_PLAINTEXT_ON_STARTUP:false}
  frontend:
    base-url: ${SHOP_FRONTEND_BASE_URL:http://localhost:5174}
  admin:
    base-url: ${SHOP_ADMIN_BASE_URL:http://127.0.0.1:5173}
  upload:
    inquiry-image-dir: ${SHOP_INQUIRY_IMAGE_DIR:uploads/inquiries_images}
    homepage-image-dir: ${SHOP_HOMEPAGE_IMAGE_DIR:uploads/homepage_images}
  product-discovery:
    provider: ${PRODUCT_SEARCH_PROVIDER:disabled}
    serpapi-key: ${SERPAPI_API_KEY:}
    search-cache-ttl: ${PRODUCT_SEARCH_CACHE_TTL:P1D}
    detail-cache-ttl: ${PRODUCT_DETAIL_CACHE_TTL:P7D}
    quota-reserve: ${SERPAPI_QUOTA_RESERVE:10}
    ai-provider: ${PRODUCT_AI_PROVIDER:disabled}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    ollama-model: ${OLLAMA_MODEL:qwen2.5:7b}
    browser-rendering-enabled: ${PRODUCT_BROWSER_RENDERING_ENABLED:true}
  payment:
    sbps:
      enabled: ${SBPS_ENABLED:false}
      merchant-id: ${SBPS_MERCHANT_ID:}
      service-id: ${SBPS_SERVICE_ID:}
      hash-key: ${SBPS_HASH_KEY:}
      request-url: ${SBPS_REQUEST_URL:}
      callback-base-url: ${SBPS_CALLBACK_BASE_URL:}
      client-base-url: ${SBPS_CLIENT_BASE_URL:http://localhost:5174}
      payment-methods: ${SBPS_PAYMENT_METHODS:credit3d2,paypay,paypal}
    japan:
      krw-to-jpy-rate: ${PAYMENT_KRW_TO_JPY_RATE:0}
      automatic-rate-markup: ${PAYMENT_AUTOMATIC_RATE_MARKUP:1.03}
  pricing:
    agency-fee-rate: ${SHOP_AGENCY_FEE_RATE:0}
    default-domestic-shipping-fee-krw: ${SHOP_DEFAULT_DOMESTIC_SHIPPING_FEE_KRW:3000}
  customs:
    japan:
      refresh-interval: ${JAPAN_CUSTOMS_REFRESH_INTERVAL:PT24H}
      initial-refresh-delay: ${JAPAN_CUSTOMS_INITIAL_REFRESH_DELAY:PT1M}
      fallback-krw-to-jpy-rate: ${JAPAN_CUSTOMS_KRW_TO_JPY_RATE:0}
      exchange-index-url: ${JAPAN_CUSTOMS_EXCHANGE_INDEX_URL:https://www.customs.go.jp/english/kawase/index_e.htm}
      simplified-tariff-url: ${JAPAN_CUSTOMS_TARIFF_URL:https://www.customs.go.jp/english/c-answer_e/imtsukan/1001_e.htm}
      consumption-tax-url: ${JAPAN_CUSTOMS_CONSUMPTION_TAX_URL:https://www.customs.go.jp/english/c-answer_e/imtsukan/1111_e.htm}
